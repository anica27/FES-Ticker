name: Keep Streamlit Alive

on:
  schedule:
    # Läuft alle 6 Stunden (um 00:00, 06:00, 12:00 und 18:00 UTC)
    - cron: '0 */6 * * *'
  # Erlaubt es, den Ping manuell im GitHub-Reiter "Actions" zu testen
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App URL
        run: |
          curl -sL --max-time 30 https://fes-ticker.streamlit.app > /dev/null
          echo "Ping an fes-ticker.streamlit.app erfolgreich abgesetzt."
